mission:
  objective: "Get to 20 paying customers by the end of Q3"
  measure:
    what: "count of active paying customers"
    where: "select count(distinct customer_id) from subscriptions where status='active'"
    target: 20
    goal: reach_and_maintain
  horizon: "2026-09-30, reviewed weekly"
  boundaries:
    may_act_alone:
      - "research prospects and enrich the CRM"
      - "contact individual prospects and customers"
      - "draft and publish ordinary business material"
      - "move deals through pipeline stages"
      - "prepare and schedule delivery work"
      - "commit to ordinary dates and scopes"
    must_ask_first:
      - "a plan whose expected expense is over $3"

engine:
  mode: subscription
  resident_agent: codex

models:
  mode: subscription
  engine: codex

budget:
  money:
    daily_soft_usd: 3.00
    monthly_hard_usd: 50.00
  autonomy:
    level: act-external
    per_plan_approval_usd: 3.00
    blast_radius_gate_level: 3

surfaces:
  notify:
    channel: none
    address: ""

curiosity:
  enabled: false

datastore:
  graph: age

template: running-a-business
