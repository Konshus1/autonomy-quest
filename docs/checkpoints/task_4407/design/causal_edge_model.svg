<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .t{fill:#0f172a;font-size:13px}.th{fill:#0f172a;font-size:15px;font-weight:700}
      .sub{fill:#475569;font-size:11px}.node{fill:#ffffff;stroke:#94a3b8}
      .det{fill:#dcfce7;stroke:#16a34a}.prob{fill:#fef3c7;stroke:#d97706}
      .w{fill:#eff6ff;stroke:#3b82f6}.exec{fill:#e0e7ff;stroke:#6366f1}.learn{fill:#ede9fe;stroke:#7c3aed}
      .edge{stroke:#334155;stroke-width:1.6;fill:none}.gedge{stroke:#7c3aed;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1020" height="620" fill="#ffffff"/>
  <text x="24" y="30" class="th" font-size="17">Causal edge model (agreed) — one edge, three dials, an actuator, and a surprise loop</text>

  <!-- the two linked claims -->
  <rect x="30" y="70" width="180" height="60" rx="10" class="node"/><text x="120" y="98" class="t" text-anchor="middle">Action / Cause</text><text x="120" y="116" class="sub" text-anchor="middle">a step the system can take</text>
  <rect x="330" y="70" width="180" height="60" rx="10" class="det"/><text x="420" y="94" class="t" text-anchor="middle">Direct effect</text><text x="420" y="112" class="sub" text-anchor="middle">mechanical, can be DETERMINISTIC</text>
  <rect x="650" y="70" width="200" height="60" rx="10" class="prob"/><text x="750" y="94" class="t" text-anchor="middle">Mission measure</text><text x="750" y="112" class="sub" text-anchor="middle">goal-potency, PROBABILISTIC</text>

  <path class="edge" d="M210,100 L330,100" marker-end="url(#e)"/>
  <text x="270" y="90" class="sub" text-anchor="middle">CAUSES</text>
  <text x="270" y="118" class="sub" text-anchor="middle">scriptable</text>
  <path class="edge" d="M510,100 L650,100" marker-end="url(#e)"/>
  <text x="580" y="90" class="sub" text-anchor="middle">moves</text>
  <text x="580" y="118" class="sub" text-anchor="middle">weighted belief</text>

  <text x="30" y="156" class="sub">A script can GUARANTEE the action + its direct effect (in scope). Whether that effect moves the goal stays a weighted belief — the world is in the loop.</text>

  <!-- three dials -->
  <rect x="30" y="180" width="620" height="150" rx="10" class="w"/>
  <text x="46" y="204" class="th">Three independent weights (separately queryable)</text>
  <rect x="46" y="216" width="190" height="96" rx="8" class="node"/>
  <text x="141" y="238" class="t" text-anchor="middle" font-weight="700">1 · formality</text>
  <text x="141" y="258" class="sub" text-anchor="middle">how SURE the</text>
  <text x="141" y="274" class="sub" text-anchor="middle">causality is true</text>
  <text x="141" y="294" class="sub" text-anchor="middle">(epistemic, from evidence)</text>
  <rect x="248" y="216" width="190" height="96" rx="8" class="node"/>
  <text x="343" y="238" class="t" text-anchor="middle" font-weight="700">2 · strictness</text>
  <text x="343" y="258" class="sub" text-anchor="middle">how HARD it binds</text>
  <text x="343" y="274" class="sub" text-anchor="middle">advisory / soft /</text>
  <text x="343" y="294" class="sub" text-anchor="middle">hard-guardrail (policy)</text>
  <rect x="450" y="216" width="190" height="96" rx="8" class="node"/>
  <text x="545" y="238" class="t" text-anchor="middle" font-weight="700">3 · directness</text>
  <text x="545" y="258" class="sub" text-anchor="middle">judgment to predicate</text>
  <text x="545" y="274" class="sub" text-anchor="middle">to executable SCRIPT</text>
  <text x="545" y="294" class="sub" text-anchor="middle">(how deterministic)</text>

  <!-- executor slot -->
  <rect x="670" y="180" width="320" height="150" rx="10" class="exec"/>
  <text x="686" y="204" class="th">Executor slot (on the edge)</text>
  <text x="686" y="230" class="t">A · ACTUATOR — runs the action deterministically</text>
  <text x="700" y="248" class="sub">the source of a guaranteed action (primary role)</text>
  <text x="686" y="272" class="t">B · verifier — checks preconditions / effect</text>
  <text x="700" y="290" class="sub">optional, only when warranted</text>
  <text x="686" y="312" class="t">C · constraint — forbids violating plans</text>

  <!-- surprise loop -->
  <rect x="30" y="360" width="960" height="150" rx="10" class="learn"/>
  <text x="46" y="384" class="th">Surprise-driven learning (ties to surprise_resolution.py — planning_prediction_surprise)</text>
  <rect x="46" y="398" width="210" height="90" rx="8" class="node"/><text x="151" y="424" class="t" text-anchor="middle">edge carries a</text><text x="151" y="442" class="t" text-anchor="middle">PREDICTED certainty</text><text x="151" y="464" class="sub" text-anchor="middle">for its outcome</text>
  <rect x="300" y="398" width="210" height="90" rx="8" class="node"/><text x="405" y="430" class="t" text-anchor="middle">actual vs predicted</text><text x="405" y="452" class="t" text-anchor="middle">= SURPRISE</text>
  <rect x="554" y="398" width="210" height="90" rx="8" class="node"/><text x="659" y="424" class="t" text-anchor="middle">held investigation</text><text x="659" y="442" class="sub" text-anchor="middle">(gated, fail-closed)</text><text x="659" y="464" class="sub" text-anchor="middle">resolves an update</text>
  <rect x="808" y="398" width="182" height="90" rx="8" class="node"/><text x="899" y="420" class="t" text-anchor="middle">UPDATE weights</text><text x="899" y="440" class="sub" text-anchor="middle">promote: gated</text><text x="899" y="458" class="sub" text-anchor="middle">demote: fast</text><text x="899" y="474" class="sub" text-anchor="middle">drift: re-validate</text>
  <path class="gedge" d="M256,443 L300,443" marker-end="url(#eg)"/>
  <path class="gedge" d="M510,443 L554,443" marker-end="url(#eg)"/>
  <path class="gedge" d="M764,443 L808,443" marker-end="url(#eg)"/>
  <path class="gedge" d="M899,488 L899,540 L151,540 L151,488" marker-end="url(#eg)"/>
  <text x="525" y="556" class="sub" text-anchor="middle">updated weights change how the next plan is checked and executed — the causal loop closes</text>

  <text x="30" y="600" class="sub">Autonomy is gated on PROGRESS toward the goal, not on formal coverage. Formality raises plan certainty; formalization is optional; rules pass to replicas by default (defeasible).</text>
</svg>
