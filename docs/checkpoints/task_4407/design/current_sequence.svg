<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .t{fill:#0f172a;font-size:12px}.th{fill:#0f172a;font-size:13px;font-weight:700}
      .msg{stroke:#334155;stroke-width:1.4;fill:none}.ret{stroke:#64748b;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
      .life{stroke:#cbd5e1;stroke-width:1.2}.head{fill:#e2e8f0;stroke:#94a3b8}
      .sub{fill:#475569;font-size:11px}.note{fill:#fef9c3;stroke:#eab308}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="28" class="th" font-size="17">Autonomy Quest — CURRENT: one mission cycle + replication (as built)</text>

  <!-- actors -->
  <g>
    <rect x="40" y="46" width="110" height="34" rx="6" class="head"/><text x="95" y="68" class="th" text-anchor="middle">Operator</text>
    <rect x="200" y="46" width="120" height="34" rx="6" class="head"/><text x="260" y="68" class="th" text-anchor="middle">Container</text>
    <rect x="370" y="46" width="120" height="34" rx="6" class="head"/><text x="430" y="68" class="th" text-anchor="middle">Mission Loop</text>
    <rect x="540" y="46" width="130" height="34" rx="6" class="head"/><text x="605" y="68" class="th" text-anchor="middle">Executor (agent)</text>
    <rect x="720" y="46" width="110" height="34" rx="6" class="head"/><text x="775" y="68" class="th" text-anchor="middle">Postgres+AGE</text>
    <rect x="860" y="46" width="120" height="34" rx="6" class="head"/><text x="920" y="68" class="th" text-anchor="middle">Host Broker</text>
  </g>
  <g class="life">
    <line x1="95" y1="80" x2="95" y2="600"/><line x1="260" y1="80" x2="260" y2="600"/>
    <line x1="430" y1="80" x2="430" y2="600"/><line x1="605" y1="80" x2="605" y2="600"/>
    <line x1="775" y1="80" x2="775" y2="600"/><line x1="920" y1="80" x2="920" y2="600"/>
  </g>

  <!-- start -->
  <path class="msg" d="M95,104 L258,104" marker-end="url(#a)"/><text x="100" y="98" class="t">docker run + mount instance.yaml</text>
  <path class="msg" d="M260,128 L260,128"/>
  <rect x="205" y="120" width="380" height="20" class="note"/><text x="212" y="134" class="sub">Container: start Postgres+AGE → HEALTHY → if instance.yaml present, start the loop</text>

  <!-- observe -->
  <path class="msg" d="M430,164 L773,164" marker-end="url(#a)"/><text x="435" y="158" class="t">observe: read measure + live learnings</text>
  <path class="ret" d="M773,182 L432,182" marker-end="url(#a)"/><text x="435" y="196" class="sub">world (now, learnings by confidence)</text>

  <!-- decide -->
  <path class="msg" d="M430,220 L603,220" marker-end="url(#a)"/><text x="435" y="214" class="t">decide(world, learnings) → DECIDE_SCHEMA</text>
  <path class="ret" d="M603,238 L432,238" marker-end="url(#a)"/><text x="435" y="252" class="sub">work {kind,summary,rationale,reversible,...}</text>

  <!-- create + gate -->
  <path class="msg" d="M430,276 L773,276" marker-end="url(#a)"/><text x="435" y="270" class="t">create_work (persist decision BEFORE acting)</text>
  <rect x="360" y="288" width="410" height="20" class="note"/><text x="367" y="302" class="sub">gate: requires_human? → park + notify, do NOT act (autonomy level / boundaries)</text>

  <!-- act -->
  <path class="msg" d="M430,332 L603,332" marker-end="url(#a)"/><text x="435" y="326" class="t">act(work) → ACT_SCHEMA (agent does the work; may web-search)</text>
  <path class="ret" d="M603,350 L432,350" marker-end="url(#a)"/><text x="435" y="364" class="sub">{outcome, succeeded, evidence}</text>
  <path class="msg" d="M430,382 L773,382" marker-end="url(#a)"/><text x="435" y="376" class="t">record_act (write it down NOW)</text>

  <!-- reflect + learn -->
  <path class="msg" d="M430,418 L603,418" marker-end="url(#a)"/><text x="435" y="412" class="t">reflect(outcome, live learnings) → REFLECT_SCHEMA</text>
  <path class="ret" d="M603,436 L432,436" marker-end="url(#a)"/><text x="435" y="450" class="sub">{insight, evidence, scope, confidence}</text>
  <path class="msg" d="M430,468 L773,468" marker-end="url(#a)"/><text x="435" y="462" class="t">complete_run + write_learning + graph_link (ONE tx)</text>
  <rect x="360" y="480" width="430" height="20" class="note"/><text x="367" y="494" class="sub">productivity check (artifact-or-escalate); next cycle's decide() reads these learnings</text>

  <!-- replication (separate, operator-driven) -->
  <line x1="20" y1="520" x2="980" y2="520" stroke="#e2e8f0"/>
  <text x="20" y="538" class="th">Replication (surface — operator/agent-initiated, NOT autonomous):</text>
  <path class="msg" d="M605,558 L918,558" marker-end="url(#a)"/><text x="610" y="552" class="t">POST propose {straight_copy | copy_with_modifications}</text>
  <rect x="600" y="570" width="380" height="20" class="note"/><text x="607" y="584" class="sub">Host Broker: operator-gated by default · AQ_REPLICATION_AUTO_APPROVE override</text>
  <path class="msg" d="M920,598 L775,598" marker-end="url(#a)"/><text x="620" y="598" class="sub">host executes workspace copy (guest never gets docker.sock)</text>
</svg>
