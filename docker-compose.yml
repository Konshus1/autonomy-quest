name: autonomy-quest

services:
  postgres:
    # Multi-architecture, prebuilt PostgreSQL 16 image containing Apache AGE and pgvector.
    # Pin the content digest so a public install cannot silently receive a different database.
    image: brcom/postgres-age-vector:pg16v2@sha256:8e76b7d546e1b3b4d29e739584d93dcb5d35a4be1b00a5b48f2a07ad8e4c592e
    environment:
      POSTGRES_USER: aq_owner
      POSTGRES_PASSWORD: "${AQ_DB_OWNER_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      POSTGRES_DB: aq
      AQ_LOOP_DB_PASSWORD: "${AQ_LOOP_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_ACTOR_DB_PASSWORD: "${AQ_ACTOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_GOVERNANCE_DB_PASSWORD: "${AQ_GOVERNANCE_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_EVALUATOR_DB_PASSWORD: "${AQ_EVALUATOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
    volumes:
      - aq-postgres-data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U aq_owner -d aq &&
          psql -U aq_owner -d aq -Atqc "select 1 from pg_extension where extname='age'" | grep -qx 1 &&
          psql -U aq_owner -d aq -Atqc "select 1 from pg_extension where extname='vector'" | grep -qx 1 &&
          psql -U aq_owner -d aq -Atqc "select to_regclass('public.planning_prediction') is not null" | grep -qx t &&
          psql -U aq_owner -d aq -Atqc "select to_regclass('public.plan_spend_reservation') is not null" | grep -qx t &&
          psql -U aq_owner -d aq -Atqc "select to_regclass('public.subscriptions') is not null" | grep -qx t &&
          psql -U aq_owner -d aq -Atqc "select exists(select 1 from information_schema.columns where table_name='learnings' and column_name='evidence_kind')" | grep -qx t &&
          psql -U aq_owner -d aq -Atqc "select to_regclass('public.causal_principle_transition') is not null" | grep -qx t &&
          psql -U aq_owner -d aq -Atqc "select exists(select 1 from pg_constraint where conname='causal_edge_has_run_evidence')" | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: container/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "/app/scripts/apply_migrations.py"]
    environment:
      AQ_DB_URL: "postgresql://aq_owner:${AQ_DB_OWNER_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_LOOP_DB_PASSWORD: "${AQ_LOOP_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_ACTOR_DB_PASSWORD: "${AQ_ACTOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_GOVERNANCE_DB_PASSWORD: "${AQ_GOVERNANCE_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_EVALUATOR_DB_PASSWORD: "${AQ_EVALUATOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"

  governance:
    build:
      context: .
      dockerfile: container/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "-m", "uvicorn", "management.api.app:app", "--host", "0.0.0.0", "--port", "8090", "--app-dir", "/app"]
    environment:
      AQ_DB_URL: "postgresql://aq_loop:${AQ_LOOP_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_GOVERNANCE_DB_URL: "postgresql://aq_governance:${AQ_GOVERNANCE_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_GOVERNANCE_EVIDENCE_TOKEN: "${AQ_GOVERNANCE_EVIDENCE_TOKEN:-}"
      AQ_GOVERNANCE_TOKEN: "${AQ_GOVERNANCE_TOKEN:-}"
      AQ_GOVERNANCE_ADJUDICATOR: "${AQ_GOVERNANCE_ADJUDICATOR:-}"
      AQ_GOVERNANCE_DECISION_TOKEN: "${AQ_GOVERNANCE_DECISION_TOKEN:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_INSTANCE_ID: "${AQ_INSTANCE_ID:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8091:8090"

  evaluator:
    build:
      context: .
      dockerfile: container/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["python", "-m", "uvicorn", "management.api.app:app", "--host", "0.0.0.0", "--port", "8090", "--app-dir", "/app"]
    environment:
      AQ_DB_URL: "postgresql://aq_loop:${AQ_LOOP_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_GOVERNANCE_DB_URL: "postgresql://aq_evaluator:${AQ_EVALUATOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_EVALUATOR_TOKEN: "${AQ_EVALUATOR_TOKEN:-}"
      AQ_EVALUATOR_TRIGGER_TOKEN: "${AQ_EVALUATOR_TRIGGER_TOKEN:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  app:
    build:
      context: .
      dockerfile: container/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      AQ_DB_URL: "postgresql://aq_loop:${AQ_LOOP_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_ACT_DB_URL: "postgresql://aq_actor:${AQ_ACTOR_DB_PASSWORD:?run scripts/compose-with-secrets.sh instead of raw docker compose}@postgres:5432/aq"
      AQ_UI_BIND: 0.0.0.0
      AQ_UI_PORT: "8080"
      AQ_MGMT_BIND: 0.0.0.0
      AQ_MGMT_PORT: "8090"
      CODEX_HOME: /var/lib/aq/codex
      AQ_ACT_WORKSPACE: /workspace
      AQ_LOOP_AUTORESTART: "${AQ_LOOP_AUTORESTART:-1}"
      AQ_GOVERNED_FEEDBACK: "${AQ_GOVERNED_FEEDBACK:-0}"
      AQ_GOVERNANCE_URL: "http://governance:8090"
      AQ_GOVERNANCE_DECISION_TOKEN: "${AQ_GOVERNANCE_DECISION_TOKEN:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_INSTANCE_ID: "${AQ_INSTANCE_ID:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
      AQ_EVALUATOR_URL: "http://evaluator:8090"
      AQ_EVALUATOR_TRIGGER_TOKEN: "${AQ_EVALUATOR_TRIGGER_TOKEN:?run scripts/compose-with-secrets.sh instead of raw docker compose}"
    volumes:
      - aq-codex-auth:/var/lib/aq/codex
      - aq-workspace:/workspace
    # Codex's bubblewrap needs namespace syscalls Docker's default seccomp profile blocks.
    # The app itself remains non-root, has every capability dropped, and cannot gain privilege.
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"

volumes:
  aq-postgres-data:
  aq-codex-auth:
  aq-workspace:
