name: aq-c4-test
services:
  postgres:
    image: brcom/postgres-age-vector:pg16v2@sha256:8e76b7d546e1b3b4d29e739584d93dcb5d35a4be1b00a5b48f2a07ad8e4c592e
    environment:
      POSTGRES_USER: aq_owner
      POSTGRES_PASSWORD: "${AQ_DB_OWNER_PASSWORD:?missing owner password}"
      POSTGRES_DB: aq
      AQ_LOOP_DB_PASSWORD: "${AQ_LOOP_DB_PASSWORD:?missing loop password}"
      AQ_ACTOR_DB_PASSWORD: "${AQ_ACTOR_DB_PASSWORD:?missing actor password}"
      AQ_GOVERNANCE_DB_PASSWORD: "${AQ_GOVERNANCE_DB_PASSWORD:?missing governance password}"
    volumes:
      - test-db:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aq_owner -d aq && psql -U aq_owner -d aq -Atqc \"select to_regclass('public.flagship_causal_proposal_event') is not null\" | grep -qx t"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s
  c4-tests:
    build:
      context: .
      dockerfile: container/Dockerfile.test
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AQ_REQUIRE_PG_TESTS: "1"
      AQ_C4_TEST_DSN: "postgresql://aq_owner:${AQ_DB_OWNER_PASSWORD}@postgres:5432/aq"
      AQ_C4_LOOP_DSN: "postgresql://aq_loop:${AQ_LOOP_DB_PASSWORD}@postgres:5432/aq"
      AQ_C4_ACTOR_DSN: "postgresql://aq_actor:${AQ_ACTOR_DB_PASSWORD}@postgres:5432/aq"
      AQ_C4_GOVERNANCE_DSN: "postgresql://aq_governance:${AQ_GOVERNANCE_DB_PASSWORD}@postgres:5432/aq"
      AQ_GOV_TEST_DSN: "postgresql://aq_owner:${AQ_DB_OWNER_PASSWORD}@postgres:5432/aq"
      AQ_DB_URL: "postgresql://aq_loop:${AQ_LOOP_DB_PASSWORD}@postgres:5432/aq"
      AQ_GOVERNANCE_DB_URL: "postgresql://aq_governance:${AQ_GOVERNANCE_DB_PASSWORD}@postgres:5432/aq"
      AQ_GOVERNANCE_EVIDENCE_TOKEN: test-evidence-token
      AQ_GOVERNANCE_LOOP_TOKEN: test-loop-token
      AQ_INSTANCE_PATH: /app/templates/running-a-business/instance.yaml
    command: ["python", "-m", "pytest", "-q", "tests/test_c4_governance_pg.py", "tests/test_principle_governance_pg.py"]
volumes:
  test-db:
