<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The learning loop: observe, decide, act, reflect, learn — recorded and learned in one transaction">
  <rect width="760" height="420" rx="16" fill="#0f172a"/>
  <text x="380" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">The learning loop</text>
  <text x="380" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">observe → decide → act → reflect → learn — then aim the next cycle</text>

  <!-- ring guide -->
  <circle cx="380" cy="248" r="132" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- arrows around the ring (clockwise) -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ah)">
    <path d="M436 137 A132 132 0 0 1 505 226"/>
    <path d="M512 270 A132 132 0 0 1 452 356"/>
    <path d="M406 356 A132 132 0 0 1 262 322"/>
    <path d="M249 300 A132 132 0 0 1 258 176"/>
    <path d="M290 146 A132 132 0 0 1 344 129"/>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- five stage nodes -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <g><circle cx="380" cy="128" r="46" fill="#1d4ed8"/><text x="380" y="124" fill="#fff">observe</text><text x="380" y="142" fill="#bfdbfe" font-size="10" font-weight="400">read the world</text></g>
    <g><circle cx="522" cy="216" r="46" fill="#0891b2"/><text x="522" y="212" fill="#fff">decide</text><text x="522" y="230" fill="#cffafe" font-size="10" font-weight="400">consult principles</text></g>
    <g><circle cx="468" cy="352" r="46" fill="#0d9488"/><text x="468" y="348" fill="#fff">act</text><text x="468" y="366" fill="#ccfbf1" font-size="10" font-weight="400">after the gate</text></g>
    <g><circle cx="292" cy="352" r="46" fill="#4f46e5"/><text x="292" y="348" fill="#fff">reflect</text><text x="292" y="366" fill="#e0e7ff" font-size="10" font-weight="400">re-read outcome</text></g>
    <g><circle cx="238" cy="216" r="46" fill="#7c3aed"/><text x="238" y="212" fill="#fff">learn</text><text x="238" y="230" fill="#ede9fe" font-size="10" font-weight="400">record surprise</text></g>
  </g>

  <!-- center invariant -->
  <text x="380" y="238" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">record + learn</text>
  <text x="380" y="256" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">= one transaction</text>
  <text x="380" y="276" text-anchor="middle" fill="#64748b" font-size="10">a run with no learning can't report done</text>

  <text x="380" y="405" text-anchor="middle" fill="#94a3b8" font-size="11">runner/loop.py — the gate fires BEFORE the act; the outcome is re-read from source, never self-graded</text>
</svg>
