[pytest]
# Ignore ONLY the elegance corpus — not `experiments/` as a whole.
#
# `experiments/elegance_withheld_structure/` stores each graded coding task as `test_b01.py`,
# `test_s03.py`, etc. Those files are EXPERIMENT DATA: stimuli and their graders, executed by the
# experiment's own runners (`verify_corpus.py`, `verify_controls.py`, `verify_distribution.py`)
# against frozen hashes. They are not assertions about this repository, and pytest collecting them
# produced 18 import errors the moment the corpus landed on main.
#
# WHY THIS IS PATH-PRECISE, AND WHY THE OBVIOUS FIX WAS WRONG.
# The first version of this file said `norecursedirs = experiments`. That looked safe and was not:
# `experiments/causal_edges/` and `experiments/structural_analogy/` hold 66 REAL, PASSING tests
# that predate the corpus. Excluding the parent directory took the suite from 444 to 378 and
# reported success both times. A green suite that quietly collects less is the exact failure this
# project exists to catch, and the count is the only thing that showed it.
#
# So: if you ever widen this ignore, RE-COUNT. `pytest -q` must not lose tests. Compare against
# the previous commit rather than trusting that the run went green.
addopts = --ignore=experiments/elegance_withheld_structure
