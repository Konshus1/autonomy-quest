name: research-loop
version: 1
extends: null
applies_to:
  work_kind: ["*"]
deterministic: true
# A DEMONSTRATION non-default workflow: same 5-stage pipeline, same gates, same
# executor contract as default/v1 — it changes ONLY the prompt TEXT for
# decide/act/reflect, proving "a replica can run a different PROCESS" while every
# safety property is preserved by the loop (not by this file). observe and learn
# carry NO behavior block; they may not, and the loader rejects one if added.
stages:
  - id: observe
    actor: loop
    consumes: [mission, measurements, learnings]
    produces: [observation]
  - id: decide
    actor: coding_agent
    consumes: [observation]
    produces: [work_item]
    behavior:
      prompt_template: prompts/decide.md
  - id: act
    actor: coding_agent
    consumes: [work_item]
    produces: [run_result]
    behavior:
      prompt_template: prompts/act.md
  - id: reflect
    actor: coding_agent
    consumes: [run_result]
    produces: [learning]
    behavior:
      prompt_template: prompts/reflect.md
  - id: learn
    actor: kernel
    consumes: [run_result, learning]
    produces: [durable_cycle]
measure:
  mission_delta:
    query: "configured by the mission"
    direction: mission_defined
