<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-size:13px} .th{fill:#0f172a;font-size:15px;font-weight:700}
      .lane{fill:#f1f5f9;stroke:#cbd5e1} .run{fill:#dcfce7;stroke:#16a34a}
      .surf{fill:#e0e7ff;stroke:#6366f1} .box{fill:#ffffff;stroke:#94a3b8}
      .edge{stroke:#334155;stroke-width:1.5;fill:none} .sub{fill:#475569;font-size:11px}
      .tag{fill:#166534;font-size:11px;font-weight:700} .tag2{fill:#3730a3;font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="24" y="34" class="th" font-size="18">Autonomy Quest — CURRENT state (as built in code)</text>
  <text x="24" y="56" class="sub">Two subsystems. One runs autonomously; one is surfaces + gates + doctrine you drive.</text>

  <!-- Aim -->
  <rect x="24" y="80" width="180" height="54" rx="8" class="box"/>
  <text x="34" y="104" class="t">operator: docker run</text>
  <text x="34" y="122" class="sub">mounts instance.yaml (from interview)</text>
  <path class="edge" d="M204,107 L250,107" marker-end="url(#arr)"/>

  <!-- Lane A: mission loop -->
  <rect x="250" y="72" width="470" height="300" rx="10" class="run"/>
  <text x="266" y="96" class="th">A · AQ Mission Loop  <tspan class="tag">RUNNING</tspan></text>
  <text x="266" y="114" class="sub">runner/loop.py — the resident agent, forever</text>

  <rect x="300" y="130" width="120" height="40" rx="20" class="box"/><text x="360" y="155" class="t" text-anchor="middle">observe</text>
  <rect x="470" y="130" width="120" height="40" rx="20" class="box"/><text x="530" y="155" class="t" text-anchor="middle">decide</text>
  <rect x="470" y="210" width="120" height="40" rx="20" class="box"/><text x="530" y="235" class="t" text-anchor="middle">act</text>
  <rect x="300" y="210" width="120" height="40" rx="20" class="box"/><text x="360" y="235" class="t" text-anchor="middle">reflect</text>
  <rect x="300" y="290" width="290" height="40" rx="8" class="box"/><text x="445" y="315" class="t" text-anchor="middle">learn → learnings DB (by confidence)</text>

  <path class="edge" d="M420,150 L470,150" marker-end="url(#arr)"/>
  <path class="edge" d="M530,170 L530,210" marker-end="url(#arr)"/>
  <path class="edge" d="M470,230 L420,230" marker-end="url(#arr)"/>
  <path class="edge" d="M360,250 L360,290" marker-end="url(#arr)"/>
  <path class="edge" d="M300,310 L266,310 L266,150 L300,150" marker-end="url(#arr)"/>
  <text x="212" y="300" class="sub" transform="rotate(-90 212 300)">learnings feed next decide</text>

  <text x="266" y="352" class="sub">guards: budget hard-cap · escalation ladder · hibernation · productivity check (artifact-or-escalate)</text>

  <!-- Lane B: management surfaces -->
  <rect x="250" y="392" width="720" height="200" rx="10" class="surf"/>
  <text x="266" y="416" class="th">B · Ralph-Control Management  <tspan class="tag2">SURFACES + GATES + DOCTRINE</tspan></text>
  <text x="266" y="434" class="sub">management/ (FastAPI + React) · ralph_portable/ — you drive these; not an autonomous orchestrator</text>

  <rect x="266" y="450" width="210" height="56" rx="8" class="box"/>
  <text x="276" y="472" class="t">React shell + FastAPI API</text>
  <text x="276" y="490" class="sub">state · workstreams · tasks · comms (durable PG)</text>

  <rect x="496" y="450" width="210" height="56" rx="8" class="box"/>
  <text x="506" y="472" class="t">manager merge gate</text>
  <text x="506" y="490" class="sub">approve_merge | escalate_human</text>

  <rect x="726" y="450" width="228" height="56" rx="8" class="box"/>
  <text x="736" y="472" class="t">replication (surface)</text>
  <text x="736" y="490" class="sub">propose → operator/OVERRIDE → host copies</text>

  <text x="266" y="536" class="sub">Built + tested at API/broker level. NOT wired: the loop does not run a test-ladder per work item,</text>
  <text x="266" y="554" class="sub">does not spawn worker cohorts, and does not autonomously request replication. Replication copies a</text>
  <text x="266" y="572" class="sub">host-side workspace (container spin-up of the replica is a later host step).</text>

  <!-- DB -->
  <rect x="760" y="130" width="180" height="150" rx="10" class="box"/>
  <text x="850" y="158" class="t" text-anchor="middle" font-weight="700">Postgres + AGE</text>
  <text x="850" y="182" class="sub" text-anchor="middle">work · runs · learnings</text>
  <text x="850" y="200" class="sub" text-anchor="middle">measurements · graph</text>
  <text x="850" y="224" class="sub" text-anchor="middle">ralph_* mgmt tables</text>
  <path class="edge" d="M590,150 L760,175" marker-end="url(#arr)"/>
  <path class="edge" d="M590,310 L760,240" marker-end="url(#arr)"/>
</svg>
