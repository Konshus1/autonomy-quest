<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .t{fill:#0f172a;font-size:11.5px}.th{fill:#0f172a;font-size:12px;font-weight:700}
      .msg{stroke:#334155;stroke-width:1.4;fill:none}.ret{stroke:#64748b;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
      .life{stroke:#cbd5e1;stroke-width:1.1}.head{fill:#e2e8f0;stroke:#94a3b8}
      .sub{fill:#475569;font-size:10.5px}.note{fill:#fef9c3;stroke:#eab308}
      .gate{fill:#fee2e2;stroke:#dc2626}.learn{fill:#ede9fe;stroke:#7c3aed}.loop{fill:#dcfce7;stroke:#16a34a}
    </style>
  </defs>
  <rect width="1060" height="780" fill="#ffffff"/>
  <text x="20" y="26" class="th" font-size="16">Autonomy Quest — DESIRED: interview → causal-principled loop → manager-gated merge → learning</text>

  <!-- actors -->
  <g>
    <rect x="30" y="42" width="96" height="32" rx="6" class="head"/><text x="78" y="63" class="th" text-anchor="middle">Operator</text>
    <rect x="160" y="42" width="128" height="32" rx="6" class="head"/><text x="224" y="57" class="th" text-anchor="middle">Interview/Harness</text><text x="224" y="70" class="sub" text-anchor="middle">(container or coding agent)</text>
    <rect x="320" y="42" width="96" height="32" rx="6" class="head"/><text x="368" y="63" class="th" text-anchor="middle">Manager</text>
    <rect x="450" y="42" width="120" height="32" rx="6" class="head"/><text x="510" y="57" class="th" text-anchor="middle">Planner</text><text x="510" y="70" class="sub" text-anchor="middle">causal + formal</text>
    <rect x="610" y="42" width="96" height="32" rx="6" class="head"/><text x="658" y="63" class="th" text-anchor="middle">Worker</text>
    <rect x="740" y="42" width="110" height="32" rx="6" class="head"/><text x="795" y="63" class="th" text-anchor="middle">Evaluator</text>
    <rect x="890" y="42" width="140" height="32" rx="6" class="head"/><text x="960" y="57" class="th" text-anchor="middle">Principles +</text><text x="960" y="70" class="sub" text-anchor="middle">Learnings store</text>
  </g>
  <g class="life">
    <line x1="78" y1="74" x2="78" y2="742"/><line x1="224" y1="74" x2="224" y2="742"/><line x1="368" y1="74" x2="368" y2="742"/>
    <line x1="510" y1="74" x2="510" y2="742"/><line x1="658" y1="74" x2="658" y2="742"/><line x1="795" y1="74" x2="795" y2="742"/><line x1="960" y1="74" x2="960" y2="742"/>
  </g>

  <!-- interview + build -->
  <path class="msg" d="M78,96 L222,96" marker-end="url(#a2)"/><text x="82" y="90" class="t">instantiate + answer interview</text>
  <rect x="150" y="106" width="360" height="18" class="note"/><text x="156" y="119" class="sub">Harness: (a) example container OR (b) coding agent reads prompts → BUILDS + configures system as specified</text>
  <path class="msg" d="M224,140 L366,140" marker-end="url(#a2)"/><text x="228" y="134" class="t">start aimed + configured system → Manager</text>

  <!-- task + causal + plan -->
  <path class="msg" d="M368,170 L508,170" marker-end="url(#a2)"/><text x="372" y="164" class="t">create task; request plan</text>
  <path class="msg" d="M510,196 L958,196" marker-end="url(#a2)"/><text x="514" y="190" class="t">causal-principle analysis: fetch governing principles</text>
  <path class="ret" d="M958,214 L512,214" marker-end="url(#a2)"/><text x="514" y="228" class="sub">principles (current, versioned)</text>
  <rect x="450" y="238" width="360" height="18" class="note"/><text x="456" y="251" class="sub">Planner: FORMAL PLAN that PROVABLY satisfies the principles; breakdown if too big</text>
  <path class="ret" d="M508,272 L370,272" marker-end="url(#a2)"/><text x="374" y="266" class="t">proven plan + work units</text>

  <!-- work loop -->
  <rect x="600" y="290" width="360" height="180" rx="8" class="loop" fill-opacity="0.25"/>
  <text x="612" y="308" class="th">per work unit — until complete or max attempts</text>
  <path class="msg" d="M368,326 L656,326" marker-end="url(#a2)"/><text x="372" y="320" class="t">dispatch work unit (isolated worktree)</text>
  <path class="msg" d="M658,352 L793,352" marker-end="url(#a2)"/><text x="662" y="346" class="t">build + highest-feasible tests (UI&gt;API&gt;unit)</text>
  <rect x="600" y="362" width="360" height="18" class="note"/><text x="606" y="375" class="sub">Evaluator: intent coverage satisfied AND tests pass on the worker's worktree?</text>
  <path class="ret" d="M793,398 L660,398" marker-end="url(#a2)"/><text x="606" y="414" class="sub">rework list (if gaps) → worker iterates</text>
  <path class="msg" d="M658,432 L658,432"/><path class="ret" d="M656,448 L370,448" marker-end="url(#a2)"/><text x="374" y="442" class="t">unit complete (intent covered + green) → Manager</text>

  <!-- manager eval + merge gate -->
  <rect x="300" y="486" width="470" height="20" class="note"/><text x="306" y="500" class="sub">Manager: cursory review of the cohort for COMPLETENESS against task intent</text>
  <rect x="300" y="516" width="470" height="30" rx="6" class="gate"/><text x="360" y="535" class="t">Manager-gated merge → main:  approve_merge  |  escalate_human</text>
  <path class="msg" d="M368,566 L78,566" marker-end="url(#a2)"/><text x="82" y="560" class="sub">escalate_human on close calls → Operator decides</text>

  <!-- learning updates principles -->
  <path class="msg" d="M368,598 L958,598" marker-end="url(#a2)"/><text x="372" y="592" class="t">merged outcome → write learnings</text>
  <rect x="600" y="610" width="360" height="18" class="learn"/><text x="606" y="623" class="sub">Learning loop: distil merged results → UPDATE causal principles (versioned)</text>
  <path class="ret" d="M958,648 L512,648" marker-end="url(#a2)"/><text x="516" y="642" class="t">updated principles inform next analysis + plan</text>
  <path class="msg" d="M510,672 L370,672" marker-end="url(#a2)"/><text x="374" y="666" class="sub">next task planned against improved principles (loop closes)</text>

  <!-- retire -->
  <line x1="20" y1="700" x2="1040" y2="700" stroke="#e2e8f0"/>
  <text x="20" y="720" class="sub">After merge: retire worker worktrees/sessions. Optional: system may PROPOSE replication (operator-gated / host-executed) if useful to the mission.</text>
</svg>
