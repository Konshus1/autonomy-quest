<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .t{fill:#0f172a;font-size:13px}.th{fill:#0f172a;font-size:14px;font-weight:700}
      .box{fill:#ffffff;stroke:#94a3b8}.stage{fill:#eff6ff;stroke:#3b82f6}
      .setup{fill:#fef3c7;stroke:#d97706}.loop{fill:#dcfce7;stroke:#16a34a}
      .gate{fill:#fee2e2;stroke:#dc2626}.learn{fill:#ede9fe;stroke:#7c3aed}
      .edge{stroke:#334155;stroke-width:1.6;fill:none}.sub{fill:#475569;font-size:11px}
      .fb{stroke:#7c3aed;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1040" height="860" fill="#ffffff"/>
  <text x="24" y="32" class="th" font-size="18">Autonomy Quest — DESIRED state (intended workflow)</text>
  <text x="24" y="52" class="sub">Instantiation → interview → build/configure → start → causal-principled work loop → manager-gated merge → learning updates principles</text>

  <!-- Instantiation -->
  <rect x="40" y="72" width="200" height="48" rx="8" class="box"/><text x="140" y="94" class="t" text-anchor="middle">Instantiation</text><text x="140" y="110" class="sub" text-anchor="middle">operator provides parameters</text>
  <path class="edge" d="M240,96 L300,96" marker-end="url(#ar)"/>

  <!-- Interview two paths -->
  <rect x="300" y="60" width="420" height="120" rx="10" class="setup"/>
  <text x="316" y="82" class="th">Interview for mission params + system config</text>
  <rect x="316" y="94" width="180" height="72" rx="8" class="box"/>
  <text x="406" y="114" class="t" text-anchor="middle">(a) Example Docker</text>
  <text x="406" y="132" class="sub" text-anchor="middle">OOTB container interviews</text>
  <text x="406" y="148" class="sub" text-anchor="middle">operator for mission/config</text>
  <rect x="516" y="94" width="188" height="72" rx="8" class="box"/>
  <text x="610" y="114" class="t" text-anchor="middle">(b) Coding-agent harness</text>
  <text x="610" y="132" class="sub" text-anchor="middle">reads prompts, interviews,</text>
  <text x="610" y="148" class="sub" text-anchor="middle">BUILDS system as host specifies</text>
  <path class="edge" d="M720,120 L770,120 L770,150" marker-end="url(#ar)"/>

  <!-- System start -->
  <rect x="670" y="160" width="200" height="46" rx="8" class="stage"/><text x="770" y="182" class="t" text-anchor="middle">System start</text><text x="770" y="198" class="sub" text-anchor="middle">aimed + configured</text>
  <path class="edge" d="M770,206 L770,236" marker-end="url(#ar)"/>

  <!-- Task creation -->
  <rect x="670" y="240" width="200" height="46" rx="8" class="stage"/><text x="770" y="262" class="t" text-anchor="middle">Task creation</text><text x="770" y="278" class="sub" text-anchor="middle">from mission + open questions</text>
  <path class="edge" d="M670,263 L470,263" marker-end="url(#ar)"/>

  <!-- Causal principle analysis -->
  <rect x="270" y="240" width="200" height="46" rx="8" class="stage"/><text x="370" y="262" class="t" text-anchor="middle">Causal-principle analysis</text><text x="370" y="278" class="sub" text-anchor="middle">which principles govern this</text>
  <path class="edge" d="M370,286 L370,316" marker-end="url(#ar)"/>

  <!-- Formal planning proof -->
  <rect x="270" y="320" width="200" height="52" rx="8" class="stage"/><text x="370" y="342" class="t" text-anchor="middle">Formal planning</text><text x="370" y="360" class="sub" text-anchor="middle">PROVE plan satisfies principles</text>
  <path class="edge" d="M370,372 L370,402" marker-end="url(#ar)"/>

  <!-- Breakdown -->
  <rect x="270" y="406" width="200" height="46" rx="8" class="stage"/><text x="370" y="428" class="t" text-anchor="middle">Breakdown (if too big)</text><text x="370" y="444" class="sub" text-anchor="middle">split into workable units</text>
  <path class="edge" d="M370,452 L370,482" marker-end="url(#ar)"/>

  <!-- Work loop -->
  <rect x="120" y="486" width="520" height="150" rx="10" class="loop"/>
  <text x="136" y="508" class="th">Work → eval → rework loop  (per unit, until complete or max attempts)</text>
  <rect x="140" y="520" width="140" height="52" rx="8" class="box"/><text x="210" y="542" class="t" text-anchor="middle">worker builds</text><text x="210" y="560" class="sub" text-anchor="middle">isolated worktree</text>
  <rect x="300" y="520" width="150" height="52" rx="8" class="box"/><text x="375" y="540" class="t" text-anchor="middle">highest-feasible</text><text x="375" y="558" class="t" text-anchor="middle">tests (UI&gt;API&gt;unit)</text>
  <rect x="470" y="520" width="150" height="52" rx="8" class="box"/><text x="545" y="540" class="t" text-anchor="middle">evaluator</text><text x="545" y="558" class="sub" text-anchor="middle">intent coverage + tests pass</text>
  <path class="edge" d="M280,546 L300,546" marker-end="url(#ar)"/>
  <path class="edge" d="M450,546 L470,546" marker-end="url(#ar)"/>
  <path class="edge" d="M545,572 L545,600 L210,600 L210,572" marker-end="url(#ar)"/>
  <text x="360" y="618" class="sub" text-anchor="middle">rework until intent covered &amp; tests pass (bounded by max attempts → escalate)</text>
  <path class="edge" d="M370,636 L370,666" marker-end="url(#ar)"/>

  <!-- Manager evaluation -->
  <rect x="270" y="670" width="200" height="46" rx="8" class="stage"/><text x="370" y="692" class="t" text-anchor="middle">Manager evaluation</text><text x="370" y="708" class="sub" text-anchor="middle">cursory review for completeness</text>
  <path class="edge" d="M470,693 L560,693" marker-end="url(#ar)"/>

  <!-- Merge gate -->
  <rect x="560" y="670" width="220" height="46" rx="8" class="gate"/><text x="670" y="692" class="t" text-anchor="middle">Manager-gated merge → main</text><text x="670" y="708" class="sub" text-anchor="middle">approve_merge | escalate_human</text>
  <path class="edge" d="M780,693 L860,693" marker-end="url(#ar)"/>

  <!-- Learning loop -->
  <rect x="800" y="740" width="210" height="70" rx="10" class="learn"/>
  <text x="905" y="764" class="t" text-anchor="middle" font-weight="700">Learning loop</text>
  <text x="905" y="782" class="sub" text-anchor="middle">merged outcome → learnings</text>
  <text x="905" y="798" class="sub" text-anchor="middle">UPDATE causal principles</text>
  <path class="edge" d="M860,716 L905,740" marker-end="url(#ar)"/>
  <!-- feedback to causal principle analysis + planning -->
  <path class="fb" d="M800,775 L60,775 L60,263 L270,263" marker-end="url(#ar)"/>
  <text x="70" y="792" class="sub" fill="#7c3aed">updated principles feed future analysis + planning (closes the causal loop)</text>
</svg>
