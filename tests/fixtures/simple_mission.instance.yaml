# Task #4407 — the artifact a completed INTERVIEW produces for a SIMPLE mission.
# Used by tests/test_container_agent_interview.py to prove the container's ultimate agent,
# once aimed by this file, can START achieving the mission (decide -> act -> learn -> run).
mission:
  objective: "Keep at least one demo marker present as a smoke of the aimed loop."
  measure:
    what: "demo marker rows"
    where: "SELECT count(*) FROM work"   # ground-truth number lives in a real query
    target: 1000000                       # high, so never 'satisfied' / 'overshooting' during the test
    goal: reach_and_maintain
  horizon: "ongoing"
  boundaries:
    may_act_alone: ["create demo marker rows"]
    must_ask_first: ["spend money", "contact a human"]
engine:
  mode: subscription        # the interview chose a flat-rate TUI agent (cost is not the constraint)
  resident_agent: codex
budget:
  money:
    daily_soft_usd: 0       # unmetered: subscription mode has no per-cycle dollar cost
    monthly_hard_usd: 0
  autonomy:
    level: act-reversible   # may act autonomously on reversible, no-money, no-human work
surfaces:
  notify:
    channel: none
curiosity:
  enabled: false
datastore:
  engine: postgres
  graph: age
