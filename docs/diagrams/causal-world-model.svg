<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The causal world model: a claim hardens from fuzzy guess to formal guarantee, earned by evidence then a proof">
  <rect width="820" height="470" rx="16" fill="#0f172a"/>
  <text x="410" y="40" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">A causal world model that earns its confidence</text>
  <text x="410" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">every belief is a claim: <tspan fill="#cbd5e1" font-weight="600">cause → effect</tspan>, carrying three dials, promoted only when it earns it</text>

  <!-- the claim -->
  <g>
    <rect x="250" y="92" width="320" height="52" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="124" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">cause</text>
    <text x="410" y="122" text-anchor="middle" fill="#64748b" font-size="20">→</text>
    <text x="520" y="124" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">effect</text>
  </g>
  <!-- three dials -->
  <g font-size="11" text-anchor="middle">
    <text x="150" y="112" fill="#f8fafc" font-size="12" font-weight="600">three dials</text>
    <text x="150" y="130" fill="#94a3b8">formality · strictness</text>
    <text x="150" y="146" fill="#94a3b8">· directness</text>
  </g>
  <line x1="228" y1="128" x2="248" y2="118" stroke="#334155" stroke-width="1.5"/>

  <!-- the ladder: 3 rungs -->
  <g>
    <!-- fuzzy -->
    <rect x="70" y="212" width="200" height="120" rx="12" fill="#312e2a" stroke="#a16207" stroke-width="2"/>
    <text x="170" y="240" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">FUZZY</text>
    <text x="170" y="262" text-anchor="middle" fill="#fde68a" font-size="11">a mined guess</text>
    <text x="170" y="284" text-anchor="middle" fill="#d6d3d1" font-size="11">judgment · advisory</text>
    <text x="170" y="312" text-anchor="middle" fill="#a8a29e" font-size="11">plan certainty ≈ 0.34</text>

    <!-- evidential -->
    <rect x="310" y="212" width="200" height="120" rx="12" fill="#1e293b" stroke="#0891b2" stroke-width="2"/>
    <text x="410" y="240" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="700">EVIDENTIAL</text>
    <text x="410" y="262" text-anchor="middle" fill="#a5f3fc" font-size="11">confirmed by outcomes</text>
    <text x="410" y="284" text-anchor="middle" fill="#cbd5e1" font-size="11">earned support</text>
    <text x="410" y="312" text-anchor="middle" fill="#94a3b8" font-size="11">plan certainty ≈ 0.67</text>

    <!-- formal -->
    <rect x="550" y="212" width="200" height="120" rx="12" fill="#052e2b" stroke="#10b981" stroke-width="2.5"/>
    <text x="650" y="240" text-anchor="middle" fill="#34d399" font-size="16" font-weight="700">FORMAL</text>
    <text x="650" y="262" text-anchor="middle" fill="#a7f3d0" font-size="11">a proven guarantee</text>
    <text x="650" y="284" text-anchor="middle" fill="#d1fae5" font-size="11">script · hard</text>
    <text x="650" y="312" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">plan certainty = 1.0</text>
  </g>

  <!-- promotion arrows + gates -->
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <line x1="272" y1="272" x2="308" y2="272" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="512" y1="272" x2="548" y2="272" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#g)"/>

  <g text-anchor="middle" font-size="11">
    <text x="290" y="200" fill="#67e8f9" font-weight="600">↑ earned</text>
    <text x="290" y="356" fill="#94a3b8">operational confirms</text>
    <text x="290" y="372" fill="#64748b" font-size="10">(repetition, not a guarantee)</text>

    <text x="530" y="200" fill="#6ee7b7" font-weight="600">↑ proven</text>
    <text x="530" y="356" fill="#94a3b8">a passing formal oracle</text>
    <text x="530" y="372" fill="#64748b" font-size="10">(repetition can never mint this)</text>
  </g>

  <!-- footer: curiosity + honesty -->
  <line x1="60" y1="404" x2="760" y2="404" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="428" fill="#a78bfa" font-size="12" font-weight="600">curiosity</text>
  <text x="128" y="428" fill="#94a3b8" font-size="12">a bounded, opt-in drive that probes new edges — it can propose, never act on its own.</text>
  <text x="60" y="448" fill="#f59e0b" font-size="12" font-weight="600">the loop</text>
  <text x="122" y="448" fill="#94a3b8" font-size="12">consults + records against these principles; it never promotes one itself — that stays operator/CI-gated.</text>
</svg>
