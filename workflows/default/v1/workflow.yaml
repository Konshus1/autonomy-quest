name: default
version: 1
extends: null
applies_to:
  work_kind: ["*"]
deterministic: true
stages:
  - id: observe
    actor: loop
    consumes: [mission, measurements, learnings]
    produces: [observation]
  - id: decide
    actor: coding_agent
    consumes: [observation]
    produces: [work_item]
  - id: act
    actor: coding_agent
    consumes: [work_item]
    produces: [run_result]
  - id: reflect
    actor: coding_agent
    consumes: [run_result]
    produces: [learning]
  - id: learn
    actor: kernel
    consumes: [run_result, learning]
    produces: [durable_cycle]
measure:
  mission_delta:
    query: "configured by the mission"
    direction: mission_defined
