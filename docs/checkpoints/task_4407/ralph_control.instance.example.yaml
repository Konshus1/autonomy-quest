# Example fragment for instance.yaml — Ralph-control pack (Task #4407)
# Merge under the root of instance.yaml after interview 08–12.
# Default for most AQ users: omit this block or set enabled: false.

ralph_control:
  enabled: true
  roles:
    worker_engines: [codex, claude_code]
    evaluator_engines: [claude_code]
    manager_handle: "manager-primary"
  allow_non_coding_agents: true
  bus:
    kind: http_bus                 # http_bus | chat | local_mailbox
    endpoint: "http://host.docker.internal:8000/api/agents/messages"
    protocols:
      - task_claim
      - handoff
      - rework_request
      - spawn_request
  ui:
    # Docker OOTB: react_fastapi_management is concrete working code in the image.
    # Prompt-only: same default; human may set profile=custom + platforms.*.
    profile: react_fastapi_management
    show_workstreams: true
    show_agent_comms: true
  platforms:
    frontend: react
    backend: fastapi
    datastore: postgres_pgvector_age
  validation:
    ladder: [ui, api, unit]
    require_intent_adequacy: true
    integration_cohort: true
    max_rework_attempts: 3
    # Manager coding-agent approves merge, or escalates to human on uncertainty.
    merge_to_main: manager_gated
  replication:
    enabled: true
    modes: [straight_copy, copy_with_modifications]
    approval: operator_required         # operator_required | host_override_skip
    host_broker: "operator_ui"
  causal_principles:
    # AQ v1 public claims: formal causal planning OUT OF SCOPE.
    enabled: false
    require_plan_satisfies_principles: false
