# AQ Mission: Model Catalog Watchdog (Mission 1 per Kevin 2026-08-08)
# Maintains verified pricing and context-window sizes for every model on the
# OpenRouter catalog, kept fresh within 30 days.
#
# This mission produces real failures (delisted models, changed APIs, 404s)
# that the causal principle miner turns into "penalize" edges for T10 conflict
# detection.

template: running-a-research-program

datastore:
  graph: none
  version: 16

mission:
  objective: "Maintain verified pricing, context-window sizes and perceived quality for every model on the OpenRouter catalog, kept fresh within 30 days."
  measure:
    what: "in-scope items with research fresh within 30 days"
    where: "select count(distinct item_key) from research where in_scope and researched_at > now() - interval '30 days'"
    target_query: "select count(distinct item_key) from research where in_scope"
    goal: reach_and_maintain
  horizon: "reviewed weekly"
  boundaries:
    may_act_alone:
      - "research items on the public web and record verified facts with source URLs + timestamps"
      - "re-verify stale in-scope records"
      - "mark delisted models as out-of-scope with evidence"
    must_ask_first:
      - "publish or export anything"
      - "spend money"
      - "contact anyone"

# SUBSCRIPTION MODE — Kevin 2026-08-08, after ~$300 of metered spend in ONE DAY.
#
# Drives the codex CLI under the flat-rate plan: marginal cost of a cycle is ~zero and the
# constraint becomes the plan's RATE LIMIT, which loop.py already treats as an expected steady
# state rather than a failure (RateLimited -> wait -> resume).
#
# This also fixes a SECOND problem. moonshotai/kimi-k3 could not invoke tools, so the Model
# Catalog Watchdog mission — which requires the public web — was impossible to execute. The
# 2026-08-08 21:32 cron run completed with ZERO cycles: decide correctly refused the work and
# escalated. Codex ships web search (enabled explicitly in executor.py's argv).
#
# HISTORY — why this is committed rather than left as a working-tree edit: this change was first
# applied 2026-08-08 as an uncommitted edit to an UNTRACKED instance.yaml. The 00:42 merge of
# rescue/T5-T7-causal-edge-experiments brought a TRACKED instance.yaml carrying the old metered
# config, silently reverting it back to kimi-k3. An uncommitted change is not a durable change —
# the same lesson that orphaned T5/T6/T7 (BB #2423), one layer down.
engine:
  mode: subscription
  resident_agent: codex

models:
  mode: subscription
  engine: codex
  # api-mode fields below are INERT while mode=subscription (a subscription has one model —
  # there is nothing to pick). Kept so reverting is a one-word change.
  provider: openrouter
  tiers:
    reasoning: moonshotai/kimi-k3
    working: moonshotai/kimi-k3
  monthly_estimate_usd: 0.0

budget:
  money:
    daily_soft_usd: 0.50
    monthly_hard_usd: 50.00
  autonomy:
    level: act-external
    per_plan_approval_usd: 3.00
    blast_radius_gate_level: 3

surfaces:
  notify:
    channel: none
    address: ""

curiosity:
  enabled: false
